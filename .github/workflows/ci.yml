name: FraudScope verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: cp -n .openai/hosting.example.json .openai/hosting.json
      - run: pnpm test
      - run: pnpm run check
      - run: pnpm run review:verify
  research:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.dev.lock
      - run: python -m pip install -r requirements.dev.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest
  graph:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.dev.lock
      - run: python -m pip install -r requirements.gnn.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest tests/test_graph_data.py tests/test_gnn.py
