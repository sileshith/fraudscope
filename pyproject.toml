[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudscope"
version = "1.1.0"
description = "Reproducible fraud detection engineering reference with synthetic evidence and IEEE-CIS adapter"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "scipy==1.17.0", "scikit-learn==1.8.0", "joblib==1.5.3", "matplotlib==3.10.8", "fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0"]
gnn = ["torch==2.14.1"]

[project.scripts]
fraudscope = "fraudscope.cli:main"

[tool.setuptools.packages.find]
include = ["fraudscope*"]

[tool.setuptools.package-data]
fraudscope = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

